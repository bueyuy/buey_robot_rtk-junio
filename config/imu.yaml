# Giroscopio del MPU6050: bias + heading integrado (yaw) fusionado con COG GPS.
# El firmware de la ESP32 (nodo esp32_imu_node) publica el MPU6050 en
# /mpu6050/imu/data (accel + GYRO). Este nodo resta el bias del gyro e integra
# yaw -> /heading/gyro, y lo fusiona con el COG del GPS -> /heading/fused
# (absoluto ENU, el que consume rtk.py para /odom_filtered). La brujula LSM303
# fue removida: el heading ya no depende de magnetometro.
mpu6050_gyro:
  ros__parameters:
    imu_topic: "/mpu6050/imu/data"            # MPU6050 crudo (accel+gyro)
    data_calibrated_topic: "/mpu6050/imu/data_calibrated"
    heading_topic: "/heading/gyro"            # yaw integrado del gyro (relativo ENU)

    # Bias del giroscopio en rad/s [x, y, z], restado a angular_velocity.
    # Si auto_bias_enabled, se re-estima al arrancar con el robot QUIETO y este
    # valor queda solo como fallback.
    gyro_bias: [0.0, 0.0, 0.0]

    # Auto-estimacion de bias en reposo al arrancar
    auto_bias_enabled: true
    auto_bias_samples: 200            # muestras quietas a promediar (~10s a 20Hz)
    stationary_thresh: 0.05           # |gyro| rad/s para considerar "quieto" (~2.9 deg/s)
    # Deteccion de gyro muerto/congelado: std del yaw rate (wz) en la ventana de
    # auto-bias. Un MPU6050 vivo en reposo tiene ruido (std ~1e-3 rad/s); un topic
    # equivocado (LSM303, angular_velocity=0.0 exacto) o un gyro que no reporta da
    # std ~ 0. Por debajo de esto NO se completa la calibracion -> no publica
    # /heading/gyro -> el controller queda bloqueado (no navega con heading muerto).
    # 1e-4 rad/s (~0.006 deg/s) deja pasar cualquier gyro real y ataja el 0.0 exacto.
    gyro_alive_min_std: 0.0001
    # Recalibracion on-demand (std_msgs/Empty): el controller la dispara al arrancar
    # la navegacion para tener un bias fresco con el robot parado en el inicio, en vez
    # de depender del auto-bias que se hizo al levantar el stack.
    calibrate_topic: "/gyro/calibrate"

    # Integracion de heading (yaw)
    heading_initial_deg: 0.0          # heading inicial en grados
    heading_invert: false             # invertir signo si el yaw integra al reves

    # --- Fusion con COG del GPS (heading absoluto sin drift) ---
    # Con el robot en movimiento y RTK fix, el COG del GPS da heading absoluto
    # confiable. Se estima offset = (90 - cog) - gyro y se suma al gyro: el gyro
    # aporta los giros (suave, sin lag) y el GPS corrige el cero arbitrario y el
    # drift (lento). Salida /heading/fused en frame ENU: es EL heading fusionado
    # que consume rtk.py (gps.imu.use_imu_heading=true) para /odom_filtered, y que
    # llega a telemetria via pose_publisher. /heading/gyro (crudo) sigue aparte.
    gps_fusion_enabled: true
    gps_fix_topic: "/gps/fix"
    fused_heading_topic: "/heading/fused"
    # Gyro alineado al COG en convencion brujula (0=Norte, horario) = (90 - fused).
    # Es la flecha del gyro para el dashboard: yendo derecho coincide con el COG,
    # no queda defasada como /heading/gyro crudo (ENU, cero arbitrario).
    gyro_compass_topic: "/heading/gyro_compass"
    # m/s: COG confiable solo por encima de esto. Probado 2026-07-01: el robot
    # crucero a ~0.25-0.29 nunca cruzo 0.30 -> el offset no inicializo y odomYaw
    # quedo en 0 toda la corrida. 0.20 entra en rectas lentas y sigue excluyendo
    # los giros en el lugar (ahi la traslacion GPS queda baja). RTK da COG fiable
    # a 0.2 m/s (20cm/s de delta >> ruido RTK ~1-2cm).
    gps_min_speed: 0.20
    gps_require_rtk: true             # exigir RTK fix (status>=2) para corregir offset
    # Suavizado del offset. Probado 2026-06-30: 0.03 (tau~33s) converge muy lento
    # -> en un rectangulo de rectas cortas arrastra un snap inicial malo (-18 deg).
    # 0.10 (tau~10s) re-alinea en cada recta y enmascara el error de escala del
    # gyro (~-1.4%), sin meter mucho ruido del COG. Subir si converge lento;
    # bajar si el heading se pone nervioso en las rectas.
    offset_alpha: 0.10
    offset_init_samples: 5            # muestras (yendo derecho) a promediar para el snap inicial
    # Solo corregir el offset cuando |yaw rate| < esto (rad/s): yendo DERECHO.
    # Probado 2026-07-01: sin este gate, el snap y el offset se corrompian en los
    # giros (COG GPS laggea al gyro) -> err inicial -124 deg y saltos post-giro.
    # 0.08 rad/s ~= 4.6 deg/s (giros del robot ~8 deg/s quedan excluidos).
    straight_max_yaw_rate: 0.08

    # --- Convergencia del offset (senial para el creep de pre-alineacion) ---
    # Cuando el residual por fix (target-offset, yendo derecho) se mantiene chico
    # converge_min_samples fixes seguidos, el heading fused esta alineado: se publica
    # fused_ready_topic=true (latched). El controller espera esa senial antes de
    # terminar el creep y soltar la navegacion (endurece el arranque, evita el
    # 'arranca diagonal' donde el robot salia con ~127 deg de desfase).
    fused_ready_topic: "/heading/fused_ready"
    converge_tol_deg: 10.0            # |residual| que cuenta como convergido (< este)
    converge_min_samples: 4          # fixes rectos consecutivos dentro de tol (~4s a 1Hz)
