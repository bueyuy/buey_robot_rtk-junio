imu_compass:
  ros__parameters:
    # Topic de entrada (campo magnetico crudo del firmware micro-ROS) y de salida
    mag_topic: "/imu/mag"
    heading_topic: "/imu/heading_calibrated"

    # Filtrado
    glitch_threshold: 1500.0   # descartar lecturas mag con |componente| mayor (glitch I2C ~+-4096)
    filter_alpha: 0.3          # suavizado por media circular (1.0 = sin suavizado)
    invert: true               # brujula calibrada gira al reves del rumbo real (confirmado 2026-06-04 en prueba en L)

    # --- CALIBRACION hard/soft-iron (de imu_cal/fit_ellipse.py) ---
    # Obtenida 2026-06-04. NOTA: una recaptura "mas limpia" (3608 pts, residual
    # 0.49, centro -78.3/275.8) dio PEOR resultado en campo (delta +13/+35 vs
    # -8/+7) -> se revirtio a estos valores. El residual no predice bien la
    # precision real: domina el tilt durante el giro (accel del firmware roto =>
    # sin tilt-compensation). Floor practico ~+-10-15 grados.
    # Recapturado en vivo (imu_cal_live) 2026-06-11. n=154, residual=0.32, cobertura_cal=83%.
    hard_iron: [-88.96, 351.13]            # offset [x, y]
    soft_iron: [1.0076, -0.0817, -0.0817, 1.8771]   # 2x2 fila-mayor [[a,b],[c,d]]

# Giroscopio del MPU6050: bias + heading integrado (yaw).
# El firmware que corre en la ESP32 es DUAL (nodo esp32_dual_imu_node): publica
# las dos IMUs -> /imu/data (LSM303, accel+mag, SIN gyro) y /mpu6050/imu/data
# (MPU6050, accel+GYRO). Este nodo consume el MPU6050, resta el bias del gyro e
# integra yaw -> /heading/gyro (junto a /heading/gps y /heading/imu). El heading
# de gyro DERIVA (sin referencia absoluta): se expone para comparar contra mag
# (imu_compass, sobre /imu/mag de la LSM303) y GPS y decidir. No requiere reflash.
mpu6050_gyro:
  ros__parameters:
    imu_topic: "/mpu6050/imu/data"            # MPU6050 crudo (accel+gyro) del firmware dual
    data_calibrated_topic: "/mpu6050/imu/data_calibrated"
    heading_topic: "/heading/gyro"            # junto a /heading/gps y /heading/imu

    # Bias del giroscopio en rad/s [x, y, z], restado a angular_velocity.
    # Si auto_bias_enabled, se re-estima al arrancar con el robot QUIETO y este
    # valor queda solo como fallback.
    gyro_bias: [0.0, 0.0, 0.0]

    # Auto-estimacion de bias en reposo al arrancar
    auto_bias_enabled: true
    auto_bias_samples: 200            # muestras quietas a promediar (~10s a 20Hz)
    stationary_thresh: 0.05           # |gyro| rad/s para considerar "quieto" (~2.9 deg/s)

    # Integracion de heading (yaw)
    heading_initial_deg: 0.0          # heading inicial en grados
    heading_invert: false             # invertir signo si el yaw integra al reves

    # --- Fusion con COG del GPS (heading absoluto sin drift) ---
    # Con el robot en movimiento y RTK fix, el COG del GPS da heading absoluto
    # confiable. Se estima offset = (90 - cog) - gyro y se suma al gyro: el gyro
    # aporta los giros (suave, sin lag) y el GPS corrige el cero arbitrario y el
    # drift (lento). Salida /heading/fused en frame ENU: es EL heading fusionado
    # que consume rtk.py (gps.imu.heading_is_enu=true) para /odom_filtered, y que
    # llega a telemetria via pose_publisher. /heading/gyro (crudo) sigue aparte.
    gps_fusion_enabled: true
    gps_fix_topic: "/gps/fix"
    fused_heading_topic: "/heading/fused"
    gps_min_speed: 0.30               # m/s: COG confiable solo por encima de esto
    gps_require_rtk: true             # exigir RTK fix (status>=2) para corregir offset
    # Suavizado del offset. Probado 2026-06-30: 0.03 (tau~33s) converge muy lento
    # -> en un rectangulo de rectas cortas arrastra un snap inicial malo (-18 deg).
    # 0.10 (tau~10s) re-alinea en cada recta y enmascara el error de escala del
    # gyro (~-1.4%), sin meter mucho ruido del COG. Subir si converge lento;
    # bajar si el heading se pone nervioso en las rectas.
    offset_alpha: 0.10
    offset_init_samples: 5            # muestras en movimiento a promediar para el snap inicial (evita lock con COG transitorio al arrancar)
