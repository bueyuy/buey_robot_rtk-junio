broker:
  host: "192.168.90.24"
  port: 1883
  keepalive: 60
  credentials:
    username: ""
    password: ""

qos:
  telemetry: 0

reconnect:
  interval_sec: 5.0

topics:
  # Salida a motores (MotorGateway)
  motors: "bueyuy/navigation/motors"
  cmd_vel_debug: "bueyuy/navigation/cmd_vel"

  # Comandos entrantes (CommandBridge / joystick)
  joystick: "bueyuy/navigation/joystick"    # teleop "w&v"
  nav_start: "bueyuy/navigation/start"      # GO (no retained)
  waypoints: "bueyuy/waypoints"             # ruta lat/lon (retained)

  # Telemetria consolidada (TelemetryBridge) + logs (LogBridge)
  telemetry_json: "bueyuy/telemetry/json"
  logs: "bueyuy/logs"
