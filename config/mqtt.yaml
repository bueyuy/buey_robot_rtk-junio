broker:
  host: "192.168.90.24"
  port: 1883
  keepalive: 60
  credentials:
    username: ""
    password: ""

qos:
  telemetry: 0

telemetry_hz: 2.0            # tasa de la telemetria a MQTT (TelemetryBridge + cmd_vel del gateway)

reconnect:
  interval_sec: 5.0

# Topics que NO espejan un topic ROS (los demas van a bueyuy/<topic-ros> automatico).
topics:
  motors: "bueyuy/navigation/motors"        # MotorGateway -> Pico (control, no telemetria)
  cmd_vel_debug: "bueyuy/navigation/cmd_vel" # v&w aplicado (debug)
  joystick: "bueyuy/navigation/joystick"    # teleop "w&v" (in)
  logs: "bueyuy/logs"                       # LogBridge
