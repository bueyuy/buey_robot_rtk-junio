# GPS NMEA (RTK): driver serial -> /gps/fix, /gps/course, /gps/status.
gps_nmea:
  ros__parameters:
    frame_id: "gps_link"
    serial:
      port: "/dev/ttyACM0"
      baudrate: 9600
      timeout: 1.0             # s
    course:
      min_speed: 0.20          # m/s min para fiarse del COG (abajo es ruido)
      require_rtk: true        # exigir RTK para publicar /gps/course
