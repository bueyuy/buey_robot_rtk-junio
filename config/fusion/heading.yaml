# Fusion de heading: /imu/yaw + /gps/course -> /heading/fused (yaw absoluto ENU).
fusion_heading:
  ros__parameters:
    straight_max_yaw_rate: 0.08      # rad/s, corregir el offset solo yendo derecho
    offset:
      alpha: 0.10                    # EMA del offset, tau~10s
      init_samples: 5                # muestras para el snap inicial
    converge:
      tol_deg: 10.0                  # |residual| que cuenta como convergido
      min_samples: 4                 # fixes rectos seguidos para converger
