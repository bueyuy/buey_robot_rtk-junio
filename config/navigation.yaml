# UNICO yaml de navegacion. Outdoor (GPS RTK). Los waypoints llegan SIEMPRE por
# MQTT (bueyuy/waypoints, lat/lon); no hay carga por archivo YAML.
/**:
  ros__parameters:

    controller:
      frequency_hz: 10.0                   # Hz del lazo de control
      goal:
        position_tolerance_m: 0.5          # m: distancia al WP para darlo por alcanzado y pasar al siguiente
        alignment_tolerance_deg: 10.0      # grados: error de rumbo maximo antes de dejar de girar y avanzar
      velocity:
        cruise_linear_m_s: 0.3             # m/s: velocidad lineal de crucero
        min_linear_m_s: 0.20               # m/s: velocidad lineal minima (no arrastrarse -> mantiene COG util)
        cruise_angular_rad_s: 0.4          # rad/s: velocidad de giro al alinear
        max_angular_rad_s: 0.6             # rad/s: tope de velocidad angular
      angular:
        proportional_gain: 0.5             # ganancia P de correccion de rumbo en recta (bajo = suave ante ruido)
      deceleration:
        distance_m: 2.0                    # m: distancia al WP donde empieza a desacelerar
      ramp:
        accel_rate_linear: 0.015           # rampa: aceleracion lineal por tick
        decel_rate_linear: 0.03            # rampa: desaceleracion lineal por tick
        accel_rate_angular: 0.03           # rampa: aceleracion angular por tick
        decel_rate_angular: 0.03           # rampa: desaceleracion angular por tick
      prealign:
        enabled: true                      # creep recto inicial antes de navegar (genera COG, alinea el heading fused)
        distance_m: 1.0                    # m: minimo a avanzar recto antes de poder navegar
        require_fused_convergence: true    # no soltar la nav hasta que converja el heading fused (/heading/fused_ready)
        max_distance_m: 3.0                # m: tope del creep si la convergencia nunca llega
      wait_for_gyro_calibration: true      # robot quieto hasta que el gyro termine su auto-bias
      trigger_gyro_calibration: true       # recalibrar el gyro fresco al arrancar la nav (robot recien parado en el inicio)

    gps:
      heading:
        min_movement_threshold: 0.25       # m/s: por debajo de esto congela el ultimo heading bueno (evita ruido RTK)
        filter_alpha: 0.15                 # suavizado exponencial del heading GPS
      imu:
        use_imu_heading: true              #  MOVERLO FUERA DE GPS... A rtk adopta /heading/fused (gyro+COG GPS) como heading; false = solo COG GPS
        heading_topic: "/heading/fused"    # topic del heading que consume rtk

    joystick:
      cruise_linear_m_s: 0.3               # m/s: velocidad lineal del joystick
      cruise_angular_rad_s: 0.5            # rad/s: velocidad de giro del joystick
      max_angular_rad_s: 0.6               # rad/s: tope angular del joystick
      frequency_hz: 10.0                   # Hz del lazo de joystick
      timeout_ms: 600.0                    # ms: sin comando joystick por este tiempo -> cede a la nav autonoma
      ramp:
        accel_rate_linear: 0.03            # rampa joystick: aceleracion lineal
        decel_rate_linear: 0.03            # rampa joystick: desaceleracion lineal
        accel_rate_angular: 0.03           # rampa joystick: aceleracion angular
        decel_rate_angular: 0.03           # rampa joystick: desaceleracion angular
