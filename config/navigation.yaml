/**:
  ros__parameters:
    # Default vacio — el launch lo sobreescribe con LaunchConfiguration('waypoints_file').
    # Sirve como fallback si alguien levanta el controller con `ros2 run` directo.
    auto_load_waypoints: ""

    # Fuente de la meta: "waypoints_file" (YAML local x,y, relativo al arranque —
    # usado indoor) o "mqtt_waypoints" (ruta lat/lon por MQTT, origen=BASE — usado
    # outdoor, lo setea navigation_outdoor.yaml).
    goal_source: "waypoints_file"

    controller:
      frequency_hz: 10.0
      mode: "no-arc"
      goal:
        position_tolerance_m: 0.5
        alignment_tolerance_deg: 5.0
      velocity:
        cruise_linear_m_s: 0.3
        min_linear_m_s: 0.15
        cruise_angular_rad_s: 0.4
        max_angular_rad_s: 0.6
      angular:
        proportional_gain: 0.8
      deceleration:
        distance_m: 2.0
      ramp:
        accel_rate_linear: 0.015
        decel_rate_linear: 0.03
        accel_rate_angular: 0.03
        decel_rate_angular: 0.03
      arc:
        linear_m_s: 0.233
        angular_rad_s: 0.302
        start_distance_m: 1.3
      # Creep recto inicial antes de navegar: avanza en linea recta para generar
      # COG y que el heading fused (gyro+GPS, nodo mpu6050_gyro) se alinee. Sin
      # esto el robot rota en el lugar con un heading todavia sin alinear.
      # OJO: el warm-up del offset necesita ~offset_init_samples fixes GPS (1 Hz);
      # a crucero ~0.28 m/s, 0.5m da ~2 fixes. Si el heading no alcanza a alinear,
      # subir distance_m (~1.5m para 5 fixes) o bajar offset_init_samples (imu.yaml).
      prealign:
        enabled: true
        distance_m: 1.0             # minimo a avanzar recto antes de poder navegar
        # require_fused_convergence: no soltar la nav solo por avanzar distance_m;
        # ademas esperar /heading/fused_ready (offset gyro->GPS convergido). false en
        # base (indoor/ZED no tiene ese heading); navigation_outdoor.yaml lo pone true.
        require_fused_convergence: false
        max_distance_m: 3.0         # tope del creep si la convergencia nunca llega
      # Esperar a que mpu6050_gyro termine el auto-bias (robot quieto) antes de
      # moverse. false por defecto (indoor/ZED no tiene gyro -> no colgar);
      # navigation_outdoor.yaml lo pone en true.
      wait_for_gyro_calibration: false
      # Disparar una calibracion fresca del gyro al arrancar la navegacion (publica
      # /gyro/calibrate y espera el /heading/gyro recalibrado). false en base
      # (indoor); navigation_outdoor.yaml lo pone en true. Va de la mano con
      # wait_for_gyro_calibration (se dispara y se espera).
      trigger_gyro_calibration: false

    odometry:
      topic: "/zed/zed_node/odom"   # topic ZED; en outdoor_rtk se ignora (rtk.py suscribe /gps/fix)

    camera:
      offset_x_m: 0.875             # compensacion camara ZED al centro del robot

    # Parametros de heading para odometry/rtk.py
    gps:
      heading:
        min_movement_threshold: 0.1 # movimiento minimo para el heading GPS-only (m)
        filter_alpha: 0.15          # suavizado exponencial del heading GPS
      imu:
        # use_imu_heading=true: rtk adopta /heading/fused (gyro + COG GPS, ya en yaw
        # ENU, lo publica mpu6050_gyro) directo como current_heading. false: rtk cae
        # al heading del COG del GPS (sin IMU). La brujula LSM303 fue removida.
        use_imu_heading: true
        heading_topic: "/heading/fused"

    joystick:
      cruise_linear_m_s: 0.3
      cruise_angular_rad_s: 0.5
      max_angular_rad_s: 0.6
      frequency_hz: 10.0
      timeout_ms: 600.0
      ramp:
        accel_rate_linear: 0.03
        decel_rate_linear: 0.03
        accel_rate_angular: 0.03
        decel_rate_angular: 0.03
