/**:
  ros__parameters:
    gps:
      serial:
        port: "/dev/ttyACM0"        # puerto serial del GPS RTK
        baudrate: 9600
        timeout: 1.0
      # Driver: minimo de satelites para publicar /gps/fix
      min_satellites: 4
      # Driver: true exige RTK (quality >= 4); false acepta cualquier fix
      require_rtk_fix: true
      frame_id: "gps_link"

      # (El lever-arm de la antena vive en robot.yaml -> robot.antenna.offset_x_m,
      # propiedad fisica de montaje. Lo aplica el driver gps_nmea.)

      # Odometry RTK: el origen ENU es el primer fix GPS (donde arranca el robot).
      # rtk.py lo publica (bueyuy/odom/origin) para que el controller convierta los
      # waypoints al mismo frame. Ya no hay BASE marcada desde el dashboard.
      origin:
        auto_set: true
        # true: fija el origen con el primer fix RTK aunque sea FLOAT (decimetro).
        # La precision del origen NO afecta la nav (se cancela en la geometria
        # relativa robot<->waypoint), asi arranca sin esperar el Fixed. false: exige
        # RTK Fixed (cm) para el origen.
        allow_float: true

      # Odometry RTK: calidad minima para navegar
      quality:
        min_satellites: 4
        require_rtk_fix: false

      # Odometry RTK: filtro de posicion GPS
      filter:
        enabled: true
        window_size: 5
