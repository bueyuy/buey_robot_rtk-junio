<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPU6050 IMU - Monitor ROS</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
  :root {
    --bg: #0e1116; --panel: #171c24; --border: #262d38;
    --txt: #d7dde6; --muted: #8a94a3;
    --x: #ff5d5d; --y: #4ade80; --z: #5b9bff;
    --ok: #4ade80; --bad: #ff5d5d; --wait: #f5b942;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .ctrl { display: flex; align-items: center; gap: 6px; }
  input {
    background: #0e1116; border: 1px solid var(--border); color: var(--txt);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  input#url { width: 200px; }
  input#topic { width: 130px; }
  input#window { width: 56px; }
  button {
    background: #2563eb; color: #fff; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button:hover { background: #1d4ed8; }
  button.off { background: #3a4150; }
  .status { display: flex; align-items: center; gap: 7px; margin-left: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.wait { background: var(--wait); }
  .rate { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .card-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .legend { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; }
  .val { color: var(--muted); min-width: 92px; }
  canvas { width: 100%; height: 240px; display: block; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 18px 18px; line-height: 1.5; }
  code { background: #0e1116; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>MPU6050 · IMU Monitor</h1>
  <div class="ctrl"><label class="rate">ws</label><input id="url" value="ws://localhost:9090"></div>
  <div class="ctrl"><label class="rate">topic</label><input id="topic" value="/mpu6050/imu/data"></div>
  <div class="ctrl"><label class="rate">ventana s</label><input id="window" type="number" value="10" min="2" max="60"></div>
  <button id="btn">Conectar</button>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="stat">Desconectado</span>
    <span class="rate" id="rate">0 Hz</span>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head">
      <h2>Aceleración lineal <span class="rate">[m/s²]</span></h2>
      <div class="legend">
        <span><span class="swatch" style="background:var(--x)"></span>X <span class="val" id="ax">—</span></span>
        <span><span class="swatch" style="background:var(--y)"></span>Y <span class="val" id="ay">—</span></span>
        <span><span class="swatch" style="background:var(--z)"></span>Z <span class="val" id="az">—</span></span>
      </div>
    </div>
    <canvas id="cAcc"></canvas>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Velocidad angular <span class="rate">[rad/s]</span></h2>
      <div class="legend">
        <span><span class="swatch" style="background:var(--x)"></span>X <span class="val" id="gx">—</span></span>
        <span><span class="swatch" style="background:var(--y)"></span>Y <span class="val" id="gy">—</span></span>
        <span><span class="swatch" style="background:var(--z)"></span>Z <span class="val" id="gz">—</span></span>
      </div>
    </div>
    <canvas id="cGyr"></canvas>
  </div>
</main>

<p class="hint">
  Requiere <code>rosbridge</code> corriendo:
  <code>ros2 launch rosbridge_server rosbridge_websocket_launch.xml</code> —
  y el micro-ROS agent publicando <code>/imu/data</code>.
</p>

<script>
const COLORS = { x: '#ff5d5d', y: '#4ade80', z: '#5b9bff' };

// --- Buffers circulares por plot: guardan {t, x, y, z} ---
function makeBuf() { return []; }
const acc = makeBuf();   // aceleración
const gyr = makeBuf();   // giroscopio
let windowSec = 10;
let t0 = performance.now();

// --- Plotter en canvas con auto-escala y rejilla ---
function drawPlot(canvas, data, now) {
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
    canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const padL = 48, padR = 8, padT = 8, padB = 18;
  const w = cssW - padL - padR, h = cssH - padT - padB;
  const tMin = now - windowSec * 1000, tMax = now;

  // Auto-escala Y sobre la ventana visible
  let lo = Infinity, hi = -Infinity;
  for (const p of data) {
    if (p.t < tMin) continue;
    lo = Math.min(lo, p.x, p.y, p.z);
    hi = Math.max(hi, p.x, p.y, p.z);
  }
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;

  const X = t => padL + ((t - tMin) / (tMax - tMin)) * w;
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * h;

  // Rejilla + etiquetas Y
  ctx.strokeStyle = '#262d38'; ctx.fillStyle = '#8a94a3';
  ctx.lineWidth = 1; ctx.font = '11px system-ui'; ctx.textBaseline = 'middle';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = lo + (hi - lo) * i / ticks;
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(cssW - padR, y); ctx.stroke();
    ctx.fillText(v.toFixed(2), 4, y);
  }
  // Línea de cero
  if (lo < 0 && hi > 0) {
    ctx.strokeStyle = '#3a4150'; ctx.beginPath();
    ctx.moveTo(padL, Y(0)); ctx.lineTo(cssW - padR, Y(0)); ctx.stroke();
  }

  // Series
  for (const ch of ['x', 'y', 'z']) {
    ctx.strokeStyle = COLORS[ch]; ctx.lineWidth = 1.5;
    ctx.beginPath(); let started = false;
    for (const p of data) {
      if (p.t < tMin) continue;
      const px = X(p.t), py = Y(p[ch]);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}

// --- Bucle de render (desacoplado de la tasa de mensajes) ---
const cAcc = document.getElementById('cAcc'), cGyr = document.getElementById('cGyr');
function render() {
  const now = performance.now();
  const tMin = now - windowSec * 1000;
  // Purga puntos viejos
  while (acc.length && acc[0].t < tMin - 500) acc.shift();
  while (gyr.length && gyr[0].t < tMin - 500) gyr.shift();
  drawPlot(cAcc, acc, now);
  drawPlot(cGyr, gyr, now);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// --- Valores en vivo + tasa ---
function fmt(v) { return v.toFixed(3); }
let msgCount = 0, lastRateT = performance.now();
setInterval(() => {
  const n = performance.now();
  const hz = msgCount / ((n - lastRateT) / 1000);
  document.getElementById('rate').textContent = hz.toFixed(0) + ' Hz';
  msgCount = 0; lastRateT = n;
}, 1000);

// --- Conexión ROS ---
let ros = null, sub = null, connected = false;
const dot = document.getElementById('dot'), stat = document.getElementById('stat'), btn = document.getElementById('btn');

function setState(s, txt) { dot.className = 'dot ' + s; stat.textContent = txt; }

function connect() {
  windowSec = Math.max(2, Math.min(60, +document.getElementById('window').value || 10));
  const url = document.getElementById('url').value.trim();
  const topic = document.getElementById('topic').value.trim();
  setState('wait', 'Conectando…');
  ros = new ROSLIB.Ros({ url });

  ros.on('connection', () => {
    connected = true; setState('ok', 'Conectado'); btn.textContent = 'Desconectar'; btn.classList.add('off');
    sub = new ROSLIB.Topic({ ros, name: topic, messageType: 'sensor_msgs/msg/Imu', throttle_rate: 0 });
    sub.subscribe(onImu);
  });
  ros.on('error', () => setState('bad', 'Error de conexión'));
  ros.on('close', () => { if (connected) setState('bad', 'Desconectado'); connected = false; btn.textContent = 'Conectar'; btn.classList.remove('off'); });
}

function disconnect() { if (sub) sub.unsubscribe(); if (ros) ros.close(); connected = false; }

function onImu(m) {
  const t = performance.now();
  const a = m.linear_acceleration, g = m.angular_velocity;
  acc.push({ t, x: a.x, y: a.y, z: a.z });
  gyr.push({ t, x: g.x, y: g.y, z: g.z });
  msgCount++;
  document.getElementById('ax').textContent = fmt(a.x);
  document.getElementById('ay').textContent = fmt(a.y);
  document.getElementById('az').textContent = fmt(a.z);
  document.getElementById('gx').textContent = fmt(g.x);
  document.getElementById('gy').textContent = fmt(g.y);
  document.getElementById('gz').textContent = fmt(g.z);
}

btn.onclick = () => { if (connected) disconnect(); else connect(); };
</script>
</body>
</html>
