; PlatformIO Project Configuration
; ESP32 - Dual IMU (LSM303 + MPU6050) con micro-ROS Serial
;
; Unifica en un solo firmware los dos sensores, en el mismo bus I2C:
;   - LSM303  -> imu/data (sensor_msgs/Imu, accel) + imu/mag (MagneticField)   [SIN CAMBIOS]
;   - MPU6050 -> mpu6050/imu/data (sensor_msgs/Imu, accel + gyro)
;
; No reemplaza a los proyectos originales (LSM303 y MPU6050 quedan intactos).

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/pololu/lsm303-arduino.git
    jrowberg/I2Cdevlib-MPU6050

build_flags =
    -DARDUINO_ESP32_DEV

board_microros_transport = serial
board_microros_distro = humble
